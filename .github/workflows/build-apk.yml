name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build APK
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "cmake;3.22.1" \
        "ndk;26.2.11394342"

  - name: Show build environment
    run: |
      echo "Java:"
      java -version

      echo "Gradle:"
      ./gradlew --version

      echo "Android SDK:"
      sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|cmake;3.22.1|ndk;26.2.11394342" || true

  - name: Make Gradle executable
    run: chmod +x ./gradlew

  - name: Clean project
    run: ./gradlew clean --stacktrace

  - name: Build Release APK
    run: ./gradlew assembleRelease --stacktrace --info

  - name: List generated APKs
    if: always()
    run: |
      echo "===== APK FILES ====="
      find app/build/outputs -type f -name "*.apk" -o -name "*.aab" -print 2>/dev/null || true

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Source2Nativo-release
      path: |
        app/build/outputs/apk/release/*.apk
      if-no-files-found: error
      retention-days: 30

  - name: Upload native build logs
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: build-logs
      path: |
        app/build/**/*.log
        app/.cxx/**
      if-no-files-found: ignore
      retention-days: 7