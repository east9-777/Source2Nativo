name: Build Source2Nativo APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Configure Gradle
        run: |
          chmod +x ./gradlew
          java -version
          ./gradlew --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/ndk/26.2.11394342"
          ls -la "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Locate APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

          echo "===== BUILD OUTPUT ====="
          find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Source2Nativo-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Source2Nativo-build-diagnostics
          path: |
            app/build/**
            app/.cxx/**
          if-no-files-found: ignore
          retention-days: 7