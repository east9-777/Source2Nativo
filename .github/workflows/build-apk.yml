name: Test GitHub Actions

on:
workflow_dispatch:
push:
branches:
- main

jobs:
test:
runs-on: ubuntu-latest

steps:
  - name: Test
    run: |
      echo "================================"
      echo "GITHUB ACTIONS FUNCIONANDO"
      echo "================================"
      echo "Data:"
      date
      echo "Sistema:"
      uname -a
      echo "Diretorio:"
      pwd
      echo "Arquivos:"
      ls -la